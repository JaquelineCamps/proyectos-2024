<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>REGISTRO DE CLIENTES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-6">
                <div class="card border-light mb-3">
                    <div class="card-header">LISTADO DE CLIENTES</div>
                    <div class="card-body">
                        <form id="frmClientes">
                            <div class="row p-1">
                                <div class="col-2">CÓDIGO</div>
                                <div class="col-4">
                                    <input type="text" class="form-control" id="txtcodigoCliente" required readonly />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-2">NOMBRE</div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="txtnombreCliente" required />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-2">DIRECCIÓN</div>
                                <div class="col-10">
                                    <input type="text" class="form-control" id="txtdireccionCliente" required />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-2">TELÉFONO</div>
                                <div class="col-4">
                                    <input type="text" class="form-control" id="txttelefonoCliente" required />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-2">DUI</div>
                                <div class="col-6">
                                    <input type="text" class="form-control" id="txtduiCliente" required />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-12">
                                    <input type="submit" value="Guardar" class="btn btn-primary" />
                                    <input type="reset" value="Nuevo" class="btn btn-warning" id="btnNuevo" />
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6">
            <table class="table table-dark table-striped table-hover" id="tblListadoClientes">
                <thead>
                    <tr>
                        <th>CÓDIGO</th>
                        <th>NOMBRE</th>
                        <th>DIRECCIÓN</th>
                        <th>TELÉFONO</th>
                        <th>DUI</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", event => {
            listarClientes();
            guardarClientes();
        });

        let modoEdicion = false; // Indicador de modo de edición

        function guardarClientes() {
            frmClientes.addEventListener("submit", async e => {
                e.preventDefault();

                let Cliente = {
                    codigo: txtcodigoCliente.value,
                    nombre: txtnombreCliente.value,
                    direccion: txtdireccionCliente.value,
                    telefono: txttelefonoCliente.value,
                    dui: txtduiCliente.value
                };

                let method = 'POST';
                let url = 'https://localhost:7010/api/Clientes';

                if (modoEdicion) {
                    // Si estamos en modo edición, actualizar el cliente existente IMPORTANTE
                    method = 'PUT';
                    url = `https://localhost:7010/api/Clientes/${Cliente.codigo}`;
                    modoEdicion = false; // Se restablece el modo edición
                }

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(Cliente)
                });

                const datos = await response.json();
                console.log(datos);
                limpiarClientes();
                listarClientes();
            });
        }

        function limpiarClientes() {
            txtcodigoCliente.value = '';
            txtnombreCliente.value = '';
            txtdireccionCliente.value = '';
            txttelefonoCliente.value = '';
            txtduiCliente.value = '';
            modoEdicion = false;
        }

        async function listarClientes() {
            const response = await fetch('https://localhost:7010/api/Clientes', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            const Clientes = await response.json();

            let filas = "";
            Clientes.forEach(Cliente => {
                filas += `
                        <tr>
                            <td>${Cliente.codigo}</td>
                            <td>${Cliente.nombre}</td>
                            <td>${Cliente.direccion}</td>
                            <td>${Cliente.telefono}</td>
                            <td>${Cliente.dui}</td>
                            <td>
                                <button class="btn btn-primary btnModificar" data-id="${Cliente.codigo}">Modificar</button>
                                <button class="btn btn-danger btnEliminar" data-id="${Cliente.codigo}">Eliminar</button>
                            </td>
                        </tr>
                    `;
            });
            let $tblClientes = document.querySelector("#tblListadoClientes > tbody");
            $tblClientes.innerHTML = filas;

            // Evento De Eliminar
            document.querySelectorAll('.btnEliminar').forEach(boton => {
                boton.addEventListener('click', async function () {
                    const idCliente = this.getAttribute('data-id');
                    const confirmacion = confirm("¿Estás seguro de que deseas eliminar este cliente?");
                    if (confirmacion) {
                        const response = await fetch(`https://localhost:7010/api/Clientes/${idCliente}`, {
                            method: 'DELETE',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });

                        if (response.ok) {
                            console.log('Cliente eliminado con éxito');
                            listarClientes(); // Actualizar la lista de clientes
                        } else {
                            console.error('Error al eliminar el cliente');
                        }
                    }
                });
            });

            // Evento De Modificar
            document.querySelectorAll('.btnModificar').forEach(boton => {
                boton.addEventListener('click', async function () {
                    const idCliente = this.getAttribute('data-id');
                    const response = await fetch(`https://localhost:7010/api/Clientes/${idCliente}`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    if (response.ok) {
                        const cliente = await response.json();
                        txtcodigoCliente.value = cliente.codigo;
                        txtnombreCliente.value = cliente.nombre;
                        txtdireccionCliente.value = cliente.direccion;
                        txttelefonoCliente.value = cliente.telefono;
                        txtduiCliente.value = cliente.dui;
                        modoEdicion = true;
                    } else {
                        console.error('Error al obtener el cliente');
                    }
                });
            });
        }

        document.getElementById("btnNuevo").addEventListener("click", limpiarClientes);
    </script>
</body>
</html>

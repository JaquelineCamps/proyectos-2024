<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title> REGISTRO DE PELICULAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-6">
                <div class="card border-light mb-3">
                    <div class="card-header">LISTADO DE PELICULAS</div>
                    <div class="card-body">
                        <form id="frmPeliculas">
                            <div class="row p-1">
                                <div class="col-2">TITULO</div>
                                <div class="col-4">
                                    <input type="text" class="form-control" id="txttituloPelicula" required />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-2">AUTOR</div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="txtautorPelicula" required />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-2">SINOPSIS</div>
                                <div class="col-10">
                                    <input type="text" class="form-control" id="txtsinopsisPelicula" required />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-2">DURACION</div>
                                <div class="col-4">
                                    <input type="text" class="form-control" id="txtduracionPelicula" required />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-2">CLASIFICACION </div>
                                <div class="col-6">
                                    <input type="text" class="form-control" id="txtclasificacionPelicula" required />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-12">
                                    <input type="submit" value="Guardar" class="btn btn-primary" />
                                    <input type="reset" value="Nuevo" class="btn btn-warning" />
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <table class="table table-dark table-striped table-hover" id="tblListadoPeliculas">
                    <thead>
                        <tr>
                            <th>TITULO</th>
                            <th>AUTOR</th>
                            <th>SINOPSIS</th>
                            <th>DURACION</th>
                            <th>CLASIFICACION</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", event => {
            listarPeliculas();
            guardarPeliculas();
        });

        let modoEdicion = false; // Indicador de modo de edición

        function guardarPeliculas() {
            frmPeliculas.addEventListener("submit", async e => {
                e.preventDefault();

                let Pelicula = {
                    titulo: txttituloPelicula.value,
                    autor: txtautorPelicula.value,
                    sinopsis: txtsinopsisPelicula.value,
                    duracion: txtduracionPelicula.value,
                    clasificacion: txtclasificacionPelicula.value
                };

                let method = 'POST';
                let url = 'https://localhost:7010/api/Peliculas';

                if (modoEdicion) {
                    // Si estamos en modo edición, actualizar la pelicula existente IMPORTANTE
                    method = 'PUT';
                    url = `https://localhost:7010/api/Peliculas/${Pelicula.titulo}`;
                    modoEdicion = false; // Se restablece el modo edición
                }

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(Pelicula)
                });

                const datos = await response.json();
                console.log(datos);
                limpiarPeliculas();
                listarPeliculas();
            });
        }

        function limpiarPeliculas() {
            txttituloPelicula.value = '';
            txtautorPelicula.value = '';
            txtsinopsisPelicula.value = '';
            txtduracionPelicula.value = '';
            txtclasificacionPelicula.value = '';
            modoEdicion = false;
        }

        async function listarPeliculas() {
            const response = await fetch('https://localhost:7010/api/Peliculas', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            const Peliculas = await response.json();

            let filas = "";
            Peliculas.forEach(Pelicula => {
                filas += `
                            <tr>
                                <td>${Pelicula.titulo}</td>
                                <td>${Pelicula.autor}</td>
                                <td>${Pelicula.sinopsis}</td>
                                <td>${Pelicula.duracion}</td>
                                <td>${Pelicula.clasificacion}</td>
                                <td>
                                    <button class="btn btn-primary btnModificar" data-id="${Pelicula.titulo}">Modificar</button>
                                    <button class="btn btn-danger btnEliminar" data-id="${Pelicula.titulo}">Eliminar</button>
                                </td>
                            </tr>
                        `;
            });
            let $tblPeliculas = document.querySelector("#tblListadoPeliculas > tbody");
            $tblPeliculas.innerHTML = filas;

            // Evento De Eliminar
            document.querySelectorAll('.btnEliminar').forEach(boton => {
                boton.addEventListener('click', async function () {
                    const idPelicula = this.getAttribute('data-id');
                    const confirmacion = confirm("¿Estás seguro de que deseas eliminar esta pelicula?");
                    if (confirmacion) {
                        const response = await fetch(`https://localhost:7010/api/Peliculas/${idPelicula}`, {
                            method: 'DELETE',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });

                        if (response.ok) {
                            console.log('Pelicula eliminado con éxito');
                            listarPeliculas(); // Actualizar la lista de peliculas
                        } else {
                            console.error('Error al eliminar la pelicula');
                        }
                    }
                });
            });

            // Evento De Modificar
            document.querySelectorAll('.btnModificar').forEach(boton => {
                boton.addEventListener('click', async function () {
                    const idPelicula = this.getAttribute('data-id');
                    const response = await fetch(`https://localhost:7010/api/Peliculas/${idPelicula}`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    if (response.ok) {
                        const pelicula = await response.json();
                        txttituloPelicula.value = Pelicula.titulo;
                        txtautorPelicula.value = Pelicula.autor;
                        txtsinopsisPelicula.value = Pelicula.sinopsis
                        txtduracionPelicula.value = Pelicula.duracion;
                        txtclasificacionPelicula.value = Pelicula.clasificacion;
                        modoEdicion = true;
                    } else {
                        console.error('Error al obtener la pelicula');
                    }
                });
            });
        }

        document.getElementById("btnNuevo").addEventListener("click", limpiarPeliculas);
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>ALQUILER DE PELICULAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-6">
                <div class="card border-light mb-3">
                    <div class="card-header">LISTADO DE ALQUILERES</div>
                    <div class="card-body">
                        <form id="frmAlquileres">
                            <div class="row p-1">
                                <div class="col-2">CODIGO</div>
                                <div class="col-4">
                                    <input type="text" class="form-control" id="txtCodigoAlquiler" required />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-2">CLIENTE</div>
                                <div class="col-8">
                                    <input type="text" class="form-control" id="txtClienteAlquiler" required />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-2">PELICULA</div>
                                <div class="col-10">
                                    <input type="text" class="form-control" id="txtPeliculaAlquiler" required />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-2">FECHA ALQUILER</div>
                                <div class="col-4">
                                    <input type="text" class="form-control" id="txtFechaalquilerAlquiler" required />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-2">FECHA DEVOLUCION </div>
                                <div class="col-6">
                                    <input type="text" class="form-control" id="txtFechadevolucionAlquiler" required />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-12">
                                    <input type="submit" value="Guardar" class="btn btn-primary" />
                                    <input type="reset" value="Nuevo" class="btn btn-warning" />
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <table class="table table-dark table-striped table-hover" id="tblListadoAlquileres">
                    <thead>
                        <tr>
                            <th>CODIGO</th>
                            <th>CLIENTE</th>
                            <th>PELICULA</th>
                            <th>FECHAALALQUILER</th>
                            <th>FECHADEVOLUCION</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", event => {
            listarAlquileres();
            guardarAlquileres();
        });

        let modoEdicion = false; // Indicador de modo de edición

        function guardarAlquileres() {
            frmAlquileres.addEventListener("submit", async e => {
                e.preventDefault();

                let Alquiler = {
                    codigo: txtcodigoAlquiler.value,
                    cliente: txtclienteAlquiler.value,
                    pelicula: txtpeliculaAlquiler.value,
                    fechaalquiler: txtfechaalquilerAlquiler.value,
                    fechadevolucion: txtfechadevolucionAlquier.value
                };

                let method = 'POST';
                let url = 'https://localhost:7010/api/Alquileres';

                if (modoEdicion) {
                    // Si estamos en modo edición, actualizar el cliente existente IMPORTANTE
                    method = 'PUT';
                    url = `https://localhost:7010/api/Alquileres/${Alquiler.codigo}`;
                    modoEdicion = false; // Se restablece el modo edición
                }

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(Alquiler)
                });

                const datos = await response.json();
                console.log(datos);
                limpiarAlquileres();
                listarAlquileres();
            });
        }

        function limpiarAlquileres() {
            txtcodigoAlquiler.value = '';
            txtclienteAlquiler.value = '';
            txtpeliculaAlquiler.value = '';
            txtfechaalquilerAlquiler.value = '';
            txtfechadevolucionAlquiler.value = '';
            modoEdicion = false;
        }

        async function listarAlquileres() {
            const response = await fetch('https://localhost:7010/api/Alquileres', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            const Alquileres = await response.json();

            let filas = "";
            Alquileres.forEach(Alquiler => {
                filas += `
                                <tr>
                                    <td>${Alquiler.codigo}</td>
                                    <td>${Alquiler.cliente}</td>
                                    <td>${Alquiler.pelicula}</td>
                                    <td>${Alquiler.fechaalquiler}</td>
                                    <td>${Alquiler.fechadevolucion}</td>
                                    <td>
                                        <button class="btn btn-primary btnModificar" data-id="${Alquiler.codigo}">Modificar</button>
                                        <button class="btn btn-danger btnEliminar" data-id="${Alquiler.codigo}">Eliminar</button>
                                    </td>
                                </tr>
                            `;
            });
            let $tblAlquileres = document.querySelector("#tblListadoAlquileres > tbody");
            $tblAlquileres.innerHTML = filas;

            // Evento De Eliminar
            document.querySelectorAll('.btnEliminar').forEach(boton => {
                boton.addEventListener('click', async function () {
                    const idAlquiler = this.getAttribute('data-id');
                    const confirmacion = confirm("¿Estás seguro de que deseas eliminar este alquiler?");
                    if (confirmacion) {
                        const response = await fetch(`https://localhost:7010/api/Alquileres/${idAlquiler}`, {
                            method: 'DELETE',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });

                        if (response.ok) {
                            console.log('Alquiler eliminado con éxito');
                            listarAlquileres(); // Actualizar la lista de alquileres
                        } else {
                            console.error('Error al eliminar el alquiler');
                        }
                    }
                });
            });

            // Evento De Modificar
            document.querySelectorAll('.btnModificar').forEach(boton => {
                boton.addEventListener('click', async function () {
                    const IdAlquiler = this.getAttribute('data-id');
                    const response = await fetch(`https://localhost:7010/api/Alquileres/${IdAlquiler}`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    if (response.ok) {
                        const alquiler = await response.json();
                        txtcodigoAlquiler.value = Alquiler.codigo;
                        txtclienteAlquiler.value = Alquiler.cliente;
                        txtpeliculaAlquiler.value = Alquiler.pelicula;
                        txtfechaalquilerAlquiler.value = Alquiler.fechaalquiler;
                        txtfechadevolucionAlquiler.value = Alquiler.fechadevolucion;
                        modoEdicion = true;
                    } else {
                        console.error('Error al obtener el alquiler');
                    }
                });
            });
        }

        document.getElementById("btnNuevo").addEventListener("click", limpiarAlquileres);
    </script>
</body>
</html>
